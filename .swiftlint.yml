# Post-split structural ratchet with deliberate headroom; lower it again if measured maxima drop.
included:
  - Sources
  - Tests

only_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - type_body_length

file_length:
  warning: 1950
  error: 2050

type_body_length:
  warning: 1050
  error: 1100

function_body_length:
  warning: 375
  error: 400

cyclomatic_complexity:
  warning: 30
  error: 33
