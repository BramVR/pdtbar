name: CI

# Lean replacement for the workflow removed in PR #188 (billing/spending
# limits): one small macOS job, no matrix, no sharding, cancel superseded runs.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      # Swift tests load these fixtures at runtime, so keep them CI-triggering.
      - "docs/pdt/fixtures/**"
      - "!**.md"
      # pdtbar-checks checks the code anchors in the formal-model skills.
      - ".claude/skills/verify-*/SKILL.md"
      - "docs/public/features.*.md"
      - "docs/features-menu-copy-allowlist.txt"
      - "docs/unchecked-sendable-baseline.txt"
      - "docs/smoke/*.svg"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "docs/pdt/fixtures/**"
      - "!**.md"
      - ".claude/skills/verify-*/SKILL.md"
      - "docs/public/features.*.md"
      - "docs/features-menu-copy-allowlist.txt"
      - "docs/unchecked-sendable-baseline.txt"
      - "docs/smoke/*.svg"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.1.1 (if present) or fallback to default
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.1.1.app /Applications/Xcode_26.1.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "${candidate}/Contents/Developer"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          /usr/bin/xcodebuild -version
          swift --version

      - name: Lint
        run: ./Scripts/check.sh lint

      - name: Script syntax
        run: ./Scripts/check.sh scripts

      - name: Build
        run: ./Scripts/check.sh build

      - name: Test
        # Raw parallel `swift test` is flaky on shared CI runners: timing-
        # sensitive suites (e.g. background detail refresh) hit internal
        # timeouts under contention. Use the repo's bounded suite runner
        # (swift test --no-parallel per suite) with the pre-#188 CI knobs.
        env:
          PDTBAR_TEST_GROUP_SIZE: "1"
          PDTBAR_TEST_SUITE_TIMEOUT: "120"
        run: ./Scripts/check.sh tests

      - name: Deterministic checks
        run: ./Scripts/check.sh checks

      - name: Committed proofs match the code
        run: ./Scripts/check.sh proofs

      - name: Scripted API smoke matrix
        run: ./Scripts/check.sh smoke-api

  formal:
    # TLA+ models replay past concurrency bugs (#269, #270, #275, #290, #301);
    # each must pass and still catch every mutation. Linux: no Swift needed.
    name: Formal models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tlaplus
          key: tla2tools-1.7.4

      - name: Models pass and catch every mutation
        run: ./Scripts/check.sh formal
